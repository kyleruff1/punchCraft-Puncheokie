name: ci

on:
  push:
    branches: [main]
  pull_request:

# Android builds are done locally per §11.2 — CI does not set up the Android SDK.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Node 24 matches the workstation toolchain and, unlike Node 20, ships
      # `node:sqlite` — the storage suite runs its migrations against a real
      # in-memory SQLite instead of adding a native dependency (§21).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The suite is 176 files / ~4 100 tests and the runner OOM'd at Node's
      # default ~2 GB heap ("Reached heap limit", exit 134) with the main
      # process at 2 040 MB — the results accumulating in the parent, not a
      # leak in any one test. Raise the ceiling and recycle workers that grow
      # past half a gig, so a suite that keeps growing degrades into a slower
      # run rather than a crash that looks like a test failure.
      - run: npm test -- --ci --colors --reporters=default --maxWorkers=2 --workerIdleMemoryLimit=512MB
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: node tools/guards/velocity-terminology.mjs
