name: ci

on:
  push:
    branches: [main]
  pull_request:

# Android builds are done locally per §11.2 — CI does not set up the Android SDK.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci --colors --reporters=default
      - run: node tools/guards/velocity-terminology.mjs
